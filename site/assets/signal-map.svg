<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">Una señal toma contexto en TaQ</title>
  <desc id="desc">Fuentes públicas se conectan con la ingesta, el contexto y las reglas. El resultado es un hallazgo para revisión humana.</desc>
