services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:?copia .env.example a .env}
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --default-log-level=info
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:?copia .env.example a .env}
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["rpk"]
    command:
      - topic
      - create
      - events.raw
      - --brokers
      - redpanda:9092
      - --partitions
      - "6"
      - --replicas
      - "1"
      - --topic-config
      - retention.ms=604800000
      - --if-not-exists
    restart: "no"

  redis:
    image: redis:${REDIS_VERSION:?copia .env.example a .env}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:?copia .env.example a .env}
    depends_on:
      topic-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-taq_dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=$${CLICKHOUSE_USER:-default} --password=$${CLICKHOUSE_PASSWORD:-taq_dev} --query='SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    image: pgvector/pgvector:${PGVECTOR_VERSION:?copia .env.example a .env}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taq_dev}
      POSTGRES_DB: ${POSTGRES_DB:-taq}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redpanda_data:
  redis_data:
  clickhouse_data:
  postgres_data:
