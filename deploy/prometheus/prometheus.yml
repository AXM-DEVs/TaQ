global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: [redpanda:9644]
  - job_name: clickhouse
    static_configs:
      - targets: [clickhouse:9363]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]

